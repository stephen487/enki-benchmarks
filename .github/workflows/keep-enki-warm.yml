name: keep-enki-warm
# Pings the companion's /healthz every ~10 min so Render's free tier never spins the instance down —
# a spun-down instance cold-starts and 502s on the user's FIRST request (the "it's broken" failure).
# Lives in this PUBLIC repo because public-repo GitHub Actions minutes are unlimited/free (a private repo
# would burn the 2000-min/mo cap). GitHub can delay scheduled runs under load, so the companion also
# retries once on a 5xx — the two together keep it reliably warm. Manual run: Actions -> keep-enki-warm
# -> Run workflow. NOTE: GitHub disables a repo's scheduled workflows after 60 days with no commits.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping healthz (twice, 45s apart, to bridge cron delays)
        run: |
          for i in 1 2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 https://enki-companion.onrender.com/healthz || echo 000)
            echo "ping $i -> HTTP $code"
            if [ "$i" = "1" ]; then sleep 45; fi
          done
